abstract: 'Load-seeking allocation rules can be drawn toward a resource that refuses entry, because a
  closed resource reports the lowest load. We study this failure in a small allocation model in which
  ten items move among seven holes using sampled load reports. The pigeonhole bound constrains fully placed
  assignments, but the usual overload measure records coverage and says nothing about balance, and it
  improves when items become unplaced. A paired audit separates placement, coverage and balance, gives
  every condition the same random inputs, and compares load-seeking rules with random movement, staying
  put, and an arrival-aware comparison. Across thirty seed tapes, closing five holes leaves a mean of
  5.03 items unplaced under the original comparison rule. Sampling every hole does not help, whereas trying
  another candidate after rejection places every item. The effect of tiny Gaussian errors depends on how
  noisy loads are encoded: truncation and unquantized reports both worsen allocation, while nearest-integer
  rounding preserves the noiseless result at the smallest tested scale. Accounting for the arriving item
  prevents that endpoint loss, although movement continues. Blocking entry to a hole preserves its existing
  occupancy, whereas eviction creates a separate recovery problem. The failures lie in admission information
  and in local cost comparisons. The results support a method for inspecting perturbation models and license
  no further inference about cognition or access to mathematical patterns.'
web_blurb: In a ten-item, seven-hole allocation model, closed holes that report zero load trap a greedy
  rule, leaving 5.03 items unplaced on average while the overload score improves. Noise encoding and pre-arrival
  cost comparisons explain further failures.
